{% set name = "trame-jupyter-extension" %}
{% set version = "2.1.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/trame_jupyter_extension-{{ version }}.tar.gz
  sha256: b79dc60be7fc14bc4413299e4b00f9b34558d6e55b8be8442c0763783ae5ab5d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version >=0.3.2
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - jupyterlab >=4,<5
    - jupyter_server >=2.0.1,<3
    - trame >=3.2.7

test:
  imports:
    - trame_jupyter_extension
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Kitware/trame-jupyter-extension
  summary: A JupyterLab extension for trame communication layer
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - alesgenova
    - jourdain
